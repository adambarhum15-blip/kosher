<!DOCTYPE html>

<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>כושר מחזור ע"ה</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;700;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0F172A;--card:#1E293B;--dark:#0F172A;--green:#10B981;--green-light:#ECFDF5;--green-border:#A7F3D0;--gray:#94A3B8;--gray-light:#E2E8F0;--gray-bg:#64748B;--red:#EF4444;--yellow:#F59E0B;--blue:#3B82F6;--radius:14px;--shadow:0 2px 12px rgba(0,0,0,.2)}
html,body{height:100%;overflow:hidden;background:var(--dark)}
body{font-family:'Heebo',sans-serif;color:#fff;-webkit-font-smoothing:antialiased}
.app{max-width:480px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;overflow:hidden;background:var(--dark)}
.page{display:none;flex-direction:column;height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:24px 20px 40px;animation:fadeUp .35s ease both}
.page.active{display:flex}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
.video-bg-page{position:relative;justify-content:center;align-items:center;text-align:center;gap:8px;z-index:1}
.video-bg-container{position:fixed;top:0;left:50%;transform:translateX(-50%);width:480px;max-width:100%;height:100dvh;overflow:hidden;z-index:0;pointer-events:none}
.video-bg-container video{width:100%;height:100%;object-fit:cover}
.video-bg-overlay{position:fixed;top:0;left:50%;transform:translateX(-50%);width:480px;max-width:100%;height:100dvh;background:linear-gradient(180deg,rgba(15,23,42,.6) 0%,rgba(15,23,42,.8) 50%,rgba(15,23,42,.95) 100%);z-index:0;pointer-events:none}
.video-bg-page>*{position:relative;z-index:2}
.logo-ring{width:140px;height:140px;border-radius:50%;overflow:hidden;margin-bottom:16px;border:4px solid rgba(255,255,255,.3);box-shadow:0 8px 40px rgba(0,0,0,.6);animation:lp 3s ease-in-out infinite}
@keyframes lp{0%,100%{box-shadow:0 8px 40px rgba(0,0,0,.6);border-color:rgba(255,255,255,.3)}50%{box-shadow:0 12px 50px rgba(16,185,129,.6);border-color:rgba(16,185,129,.7)}}
.logo-ring img{width:100%;height:100%;object-fit:cover}
.main-title{font-size:28px;font-weight:900;color:#fff;margin-bottom:4px;text-shadow:0 2px 12px rgba(0,0,0,.8)}
.sub-label{color:rgba(255,255,255,.8);font-size:14px;margin-bottom:24px;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.btn{width:100%;padding:15px;border-radius:var(--radius);font-size:16px;font-weight:700;cursor:pointer;border:none;transition:all .2s;font-family:inherit}
.btn:active{transform:scale(.97)}
.btn-solid{background:var(--green);color:#fff;box-shadow:0 4px 14px rgba(16,185,129,.4);margin-bottom:12px}
.btn-solid:hover{background:#059669}
.btn-outline{background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.4);color:#fff;backdrop-filter:blur(4px)}
.btn-outline:hover{background:rgba(255,255,255,.18)}
.btn-danger{background:var(--red);color:#fff;box-shadow:0 4px 14px rgba(239,68,68,.3)}
.btn-ghost{background:transparent;color:var(--gray);border:1px solid var(--gray-bg)}
.btn-blue{background:var(--blue);color:#fff;box-shadow:0 4px 14px rgba(59,130,246,.3);margin-bottom:12px}
.back-link{display:inline-block;margin-top:16px;color:rgba(255,255,255,.7);font-weight:700;cursor:pointer;font-size:14px}
.back-link:hover{color:#fff}
.input{width:100%;padding:15px 16px;border-radius:var(--radius);border:1.5px solid rgba(255,255,255,.2);font-size:16px;font-family:inherit;text-align:right;background:rgba(255,255,255,.08);backdrop-filter:blur(8px);color:#fff;margin-bottom:14px;outline:none;transition:border-color .2s}
.input:focus{border-color:var(--green);background:rgba(255,255,255,.15)}
.input::placeholder{color:rgba(255,255,255,.5)}
.field-label{text-align:right;font-weight:700;margin-bottom:8px;font-size:14px;color:rgba(255,255,255,.9)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;justify-content:flex-end}
.chip{padding:9px 18px;border-radius:24px;font-size:14px;font-weight:600;cursor:pointer;border:1.5px solid var(--gray-bg);background:rgba(255,255,255,.08);color:#fff;transition:all .2s;user-select:none}
.chip:hover{border-color:var(--green);background:rgba(16,185,129,.1)}
.chip.active{background:var(--green);color:#fff;border-color:var(--green)}
.home-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid rgba(255,255,255,.1)}
.greeting{font-size:24px;font-weight:900;color:#fff}
.sub-greeting{color:var(--gray);font-size:14px;margin-top:4px}
.status-dot{width:20px;height:20px;border-radius:50%;flex-shrink:0;box-shadow:0 0 12px currentColor}
.status-dot-sm{width:12px;height:12px;border-radius:50%;flex-shrink:0;margin-left:10px}
.card{background:var(--card);padding:20px;border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,.3);margin-bottom:16px;border:1px solid rgba(255,255,255,.1)}
.card-title{font-weight:700;font-size:15px;margin-bottom:12px;color:#fff}
.card-subtitle{font-size:13px;color:var(--gray);margin-bottom:8px}
.progress-bg{height:10px;background:rgba(255,255,255,.1);border-radius:6px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--green),#34d399);border-radius:6px;transition:width .5s ease}
.timer-card{background:linear-gradient(135deg,#0f172a,var(--card));padding:28px 20px;border-radius:18px;text-align:center;margin-bottom:16px;box-shadow:0 6px 24px rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.1)}
.timer-display{font-size:52px;font-weight:900;color:var(--green);letter-spacing:4px;font-variant-numeric:tabular-nums;margin-bottom:16px;text-shadow:0 0 20px rgba(16,185,129,.3)}
.timer-btns{display:flex;gap:10px;justify-content:center}
.timer-btn{padding:11px 26px;border-radius:10px;font-weight:700;font-size:14px;cursor:pointer;border:none;color:#fff;font-family:inherit;transition:all .2s}
.timer-btn:active{transform:scale(.95)}
.timer-btn-go{background:var(--green)}
.timer-btn-reset{background:var(--gray-bg)}
.section-title{font-size:17px;font-weight:700;margin:16px 0 12px;color:#fff;text-transform:uppercase;letter-spacing:.5px}
.task-card{display:flex;align-items:center;gap:14px;background:var(--card);padding:16px 18px;border-radius:var(--radius);border:1.5px solid rgba(255,255,255,.1);margin-bottom:10px;cursor:pointer;transition:all .25s;user-select:none}
.task-card:hover{border-color:var(--green);background:rgba(16,185,129,.08)}
.task-card.done{background:rgba(16,185,129,.15);border-color:var(--green)}
.check-circle{width:26px;height:26px;border-radius:50%;border:2.5px solid var(--gray-bg);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:13px;color:#fff;font-weight:900;transition:all .2s}
.task-card.done .check-circle{background:var(--green);border-color:var(--green)}
.task-info{flex:1;text-align:right}
.task-title{font-weight:700;font-size:15px;color:#fff;margin-bottom:2px}
.task-desc{font-size:13px;color:var(--gray);line-height:1.5}
.task-card.done .task-title{color:var(--green)}
.med-row{display:flex;gap:10px;margin-bottom:20px}
.med-btn{flex:1;padding:12px;border-radius:10px;text-align:center;font-size:14px;font-weight:600;cursor:pointer;border:1.5px solid var(--gray-bg);background:var(--card);color:var(--gray);transition:all .2s;user-select:none}
.med-btn:hover{border-color:var(--green)}
.med-btn.active{background:var(--green);color:#fff;border-color:var(--green)}
.content-box{background:var(--card);padding:18px;border-radius:var(--radius);border:1px solid rgba(255,255,255,.1);margin-bottom:12px;line-height:1.6;color:var(--gray)}
.content-box strong{color:#fff;display:block;margin-bottom:6px;font-size:14px}
.daily-tip{background:linear-gradient(135deg,rgba(59,130,246,.15),rgba(16,185,129,.1));padding:16px;border-radius:12px;border-left:4px solid var(--blue);margin-bottom:16px}
.daily-tip-title{font-weight:700;color:#fff;margin-bottom:6px}
.daily-tip-text{color:var(--gray);font-size:14px;line-height:1.5}
.workout-plan{background:var(--card);padding:18px;border-radius:var(--radius);border:1px solid rgba(16,185,129,.2);margin-bottom:12px}
.workout-plan-title{font-weight:700;color:var(--green);margin-bottom:8px}
.workout-plan-desc{font-size:13px;color:var(--gray);line-height:1.6}
.admin-card{display:flex;align-items:center;gap:12px;background:var(--card);padding:14px 16px;border-radius:var(--radius);border:1px solid rgba(255,255,255,.1);margin-bottom:10px;box-shadow:0 2px 12px rgba(0,0,0,.2)}
.admin-info{flex:1;text-align:right}
.admin-name{font-weight:700;font-size:15px;color:#fff}
.admin-meta{font-size:13px;color:var(--gray);margin-top:2px}
.del-btn{width:32px;height:32px;border-radius:50%;border:none;background:rgba(239,68,68,.2);color:var(--red);font-size:16px;font-weight:900;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s}
.del-btn:hover{background:rgba(239,68,68,.35)}
.logout-btn{display:block;width:100%;text-align:center;padding:14px;border-radius:var(--radius);font-weight:700;font-size:15px;cursor:pointer;border:none;background:transparent;color:var(--red);font-family:inherit;margin-top:12px}
.logout-btn:hover{background:rgba(239,68,68,.1)}
.empty-msg{text-align:center;color:var(--gray);margin-top:28px;font-size:15px}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px)}
.modal-overlay.show{display:flex}
.modal-box{background:var(--card);border-radius:20px;padding:28px 24px;max-width:420px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5);animation:mu .3s ease both;max-height:90vh;overflow-y:auto;border:1px solid rgba(255,255,255,.1)}
@keyframes mu{from{opacity:0;transform:scale(.92) translateY(10px)}to{opacity:1;transform:scale(1) translateY(0)}}
.modal-title{font-size:18px;font-weight:900;margin-bottom:8px;color:#fff}
.modal-msg{font-size:14px;color:var(--gray);margin-bottom:20px;line-height:1.6;white-space:pre-line}
.modal-btns{display:flex;gap:10px;flex-wrap:wrap}
.modal-btns .btn{flex:1;padding:12px;font-size:14px;min-width:120px}
.admin-tools{margin-top:24px;padding-top:20px;border-top:1px solid rgba(255,255,255,.1)}
.admin-btn-row{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.icon-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:14px;border-radius:var(--radius);font-size:15px;font-weight:700;cursor:pointer;border:none;font-family:inherit;color:#fff;transition:all .2s}
.icon-btn:active{transform:scale(.97)}
.icon-btn svg{width:20px;height:20px;fill:#fff;flex-shrink:0}
.icon-btn-blue{background:var(--blue)}
.icon-btn-teal{background:#0D9488}
.icon-btn-amber{background:var(--yellow)}
.report-banner{background:linear-gradient(135deg,#1e40af,#3b82f6);border-radius:16px;padding:20px;margin-bottom:16px;color:#fff;text-align:center;border:1px solid rgba(59,130,246,.3)}
.report-banner-title{font-size:16px;font-weight:900;margin-bottom:6px}
.report-banner-sub{font-size:13px;opacity:.85;margin-bottom:14px}
.report-banner-btns{display:flex;gap:8px;justify-content:center}
.report-banner-btn{padding:10px 20px;border-radius:10px;font-weight:700;font-size:13px;cursor:pointer;border:none;font-family:inherit;transition:all .2s}
.report-banner-btn-primary{background:#fff;color:#1e40af}
.report-banner-btn-secondary{background:rgba(255,255,255,.2);color:#fff}
.email-input{width:100%;padding:14px 16px;border-radius:var(--radius);border:1.5px solid rgba(255,255,255,.2);font-size:15px;font-family:inherit;text-align:left;direction:ltr;background:var(--card);color:#fff;margin-bottom:14px;outline:none}
.email-input:focus{border-color:var(--green)}
.email-input::placeholder{color:var(--gray)}
.last-report{font-size:12px;color:var(--gray);text-align:center;margin-top:8px}
.auto-reset-info{font-size:12px;color:var(--blue);text-align:center;margin-top:4px;font-weight:600}
.badge{display:inline-block;background:var(--green);color:#fff;font-size:12px;font-weight:700;padding:2px 10px;border-radius:12px;margin-right:6px}
.fb-dot{position:fixed;top:10px;left:10px;z-index:50;width:10px;height:10px;border-radius:50%;opacity:.8}
.loading{position:fixed;inset:0;background:var(--dark);z-index:200;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;transition:opacity .4s}
.loading.hide{opacity:0;pointer-events:none}
.spinner{width:40px;height:40px;border:4px solid rgba(255,255,255,.15);border-top-color:var(--green);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.loading-txt{color:rgba(255,255,255,.7);font-size:14px}
</style>
</head>

  {title:"🍌 פחמימות",text:"אכול פחמימות מורכבות לפני אימון: לחם מלא, אורז, אטריות."},

  {title:"❄️ התאוששות",text:"יום אחרי יום קשה - תעשה אימון קל או יום מנוחה מוחלטת."}
];

  "ערב: חלב + קוקואו. מעדיף התאוששות בשינה."
];

var PLANS={
"קל":[
  {id:'w1',title:"אימון כוח א'",desc:"3 סטים של 10 שכיבות סמיכה, 2 דקות פלאנק מצטבר."},
  {id:'w2',title:"אירובי בסיסי",desc:"20 דקות ריצה קלה בקצב אחיד."},
  {id:'w3',title:"כוח רגליים",desc:"3 סטים של 15 סקוואטים, 10 לאנג'ים לכל רגל."}
],
"בינוני":[
  {id:'w1',title:"כוח וסיבולת",desc:"4 סטים: 15 שכיבות סמיכה, 8 מתח, 15 מקבילים."},
  {id:'w2',title:"אינטרוולים 400",desc:"חימום + 4×400 מטר בקצב מהיר (דקה מנוחה)."},
  {id:'w3',title:"אימון פק''לים",desc:"100 בטן, 60 שכיבות סמיכה, 5 דקות פלאנק."}
],
"קשה":[
  {id:'w1',title:"כוח מתפרץ",desc:"5 סטים: 20 סמיכה יהלום, 12 מתח רחב, 20 מקבילים."},
  {id:'w2',title:"אינטרוולים 1000",desc:"3×1000 מטר בקצב בר-אור (2 דקות מנוחה)."},
  {id:'w3',title:"אימון רגליים",desc:"5 סטים: 20 סקוואט קפיצה, 20 מכרעים בהליכה."}
],
"מקצוען":[
  {id:'w1',title:"עצימות מקסימלית",desc:"Muscle ups, מתח עם משקל, סמיכה יד אחת."},
  {id:'w2',title:"סימולציית 3000",desc:"ריצת 3 ק''מ ב-95% מאמץ. מדידת זמנים."},
  {id:'w3',title:"אימון קרוספיט",desc:"סיבובים: 15 מתח, 30 סמיכה, 45 סקוואט בזמן קצוב."}
]
};

var db=null,fbOK=false,users=[ADMIN],cur=null,aFil=DEPS[0],sDep=DEPS[0],tSec=0,tInt=null,tOn=false,adEmail='';

document.getElementById('logoImg').src=LOGO_SRC;
document.getElementById('logoImg2').src=LOGO_SRC;
document.getElementById('bgV').src=VIDEO_SRC;

function initFB(){
  try{
    firebase.initializeApp({apiKey:"AIzaSyDU7mS3GD8YK3Ee8LXOYF-A0MoCW6Ownus",authDomain:"kosher-c538e.firebaseapp.com",projectId:"kosher-c538e",storageBucket:"kosher-c538e.firebasestorage.app",messagingSenderId:"68481676327",appId:"1:68481676327:web:9c5541d15de3099c3a0a02"});
    db=firebase.firestore();
    db.enablePersistence({synchronizeTabs:true}).catch(function(){});
    fbOK=true;fbDot('green');loadFB();
  }catch(e){console.warn('Firebase failed:',e);fbOK=false;fbDot('red');loadLocal();hideLo()}
}
function fbDot(c){var d=document.getElementById('fbDot');d.style.background=c==='green'?'var(--green)':c==='red'?'var(--red)':'var(--yellow)'}
function hideLo(){var l=document.getElementById('lo');l.classList.add('hide');setTimeout(function(){l.style.display='none'},500)}

function loadFB(){
  db.collection('users').onSnapshot(function(snap){
    var a=[];snap.forEach(function(d){a.push(d.data())});
    if(!a.some(function(u){return u.id==='admin'})){db.collection('users').doc('admin').set(ADMIN);a.unshift(ADMIN)}
    users=a;try{localStorage.setItem('users_db',JSON.stringify(users))}catch(e){}
    if(cur&&cur.role==='cadet'){var f=users.find(function(u){return u.id===cur.id});if(f){cur=f;saveCurL()}else{cur=null;saveCurL();go('welcome')}}
    var ap=document.querySelector('.page.active');if(ap){var pid=ap.id.replace('page-','');if(pid==='home')rHome();if(pid==='admin')rAdmin()}
    hideLo();
  },function(){fbOK=false;fbDot('red');loadLocal();hideLo()});
  var cu=localStorage.getItem('current_user');
  if(cu){cur=JSON.parse(cu);go(cur.role==='admin'?'admin':'home')}
  adEmail=localStorage.getItem('admin_email')||'';
}
function loadLocal(){
  try{var s=localStorage.getItem('users_db');if(s){var p=JSON.parse(s);users=p.some(function(u){return u.id==='admin'})?p:[ADMIN].concat(p)}
  var cu=localStorage.getItem('current_user');if(cu){cur=JSON.parse(cu);go(cur.role==='admin'?'admin':'home')}
  adEmail=localStorage.getItem('admin_email')||''}catch(e){}
}
function saveU(u){if(fbOK&&db)db.collection('users').doc(u.id).set(u).catch(function(){});users=users.map(function(x){return x.id===u.id?u:x});try{localStorage.setItem('users_db',JSON.stringify(users))}catch(e){}}
function addU(u){users.push(u);if(fbOK&&db)db.collection('users').doc(u.id).set(u).catch(function(){});try{localStorage.setItem('users_db',JSON.stringify(users))}catch(e){}}
function delU(id){users=users.filter(function(u){return u.id!==id});if(fbOK&&db)db.collection('users').doc(id).delete().catch(function(){});try{localStorage.setItem('users_db',JSON.stringify(users))}catch(e){}}
function saveCurL(){try{if(cur)localStorage.setItem('current_user',JSON.stringify(cur));else localStorage.removeItem('current_user')}catch(e){}}
function saveAll(){if(fbOK&&db){var b=db.batch();users.forEach(function(u){b.set(db.collection('users').doc(u.id),u)});b.commit().catch(function(){})}try{localStorage.setItem('users_db',JSON.stringify(users))}catch(e){}}
function delAllCadets(){var cc=users.filter(function(u){return u.role==='cadet'});if(fbOK&&db){var b=db.batch();cc.forEach(function(u){b.delete(db.collection('users').doc(u.id))});b.commit().catch(function(){})}users=[ADMIN];try{localStorage.setItem('users_db',JSON.stringify(users));localStorage.removeItem('current_user')}catch(e){}}

function showVid(s){document.getElementById('vBg').style.display=s?'block':'none';document.getElementById('vOv').style.display=s?'block':'none';if(s){var v=document.getElementById('bgV');if(v.paused)v.play().catch(function(){})}}
function go(id){
  document.querySelectorAll('.page').forEach(function(p){p.classList.remove('active');p.style.removeProperty('animation')});
  var pg=document.getElementById('page-'+id);if(pg){pg.style.animation='none';pg.offsetHeight;pg.style.removeProperty('animation');pg.classList.add('active')}
  showVid(['welcome','login','register'].indexOf(id)!==-1);
  if(id==='home')rHome();if(id==='admin'){rAdmin();chkSatBanner()}if(id==='register')rRegChips();
}
function clr(){['loginId','loginPass','regId','regName','regPass','regScore'].forEach(function(i){var e=document.getElementById(i);if(e)e.value=''});sDep=DEPS[0]}
function alert2(m){document.getElementById('mT').textContent='';document.getElementById('mM').textContent=m;document.getElementById('mE').innerHTML='';document.getElementById('mB').innerHTML='<button class="btn btn-solid" onclick="clsM()">אישור</button>';document.getElementById('modal').classList.add('show')}
function clsM(){document.getElementById('modal').classList.remove('show')}
function confirm2(t,m,fn,lb){document.getElementById('mT').textContent=t;document.getElementById('mM').textContent=m;document.getElementById('mE').innerHTML='';document.getElementById('mB').innerHTML='<button class="btn btn-ghost" onclick="clsM()">ביטול</button><button class="btn btn-danger" id="cfB">'+(lb||'אישור')+'</button>';document.getElementById('cfB').onclick=function(){clsM();fn()};document.getElementById('modal').classList.add('show')}
function mc(s){return s==='כשיר'?'var(--green)':s==='מוגבל'?'var(--yellow)':'var(--red)'}
function ft(t){return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')}
function hDate(){return new Date().toLocaleDateString('he-IL',{weekday:'long',year:'numeric',month:'long',day:'numeric'})}
function sDate(){var d=new Date();return d.getDate()+'/'+(d.getMonth()+1)+'/'+d.getFullYear()}
function getDayTip(){return TIPS[new Date().getDate()%TIPS.length]}
function getDayNutrition(){return NUTRITION[new Date().getDate()%NUTRITION.length]}

function rRegChips(){document.getElementById('regChips').innerHTML=DEPS.map(function(d){return '<div class="chip'+(sDep===d?' active':'')+'" onclick="sDep=\''+d+'\';rRegChips()">'+d+'</div>'}).join('')}

function doLogin(){
  var id=(document.getElementById('loginId').value||'').trim(),ps=document.getElementById('loginPass').value||'';
  if(!id||!ps)return alert2('אנא מלא מספר אישי וסיסמה!');
  var u=users.find(function(x){return x.id===id&&x.pass===ps});
  if(!u)return alert2('פרטים לא נכונים.');
  cur=u;saveCurL();clr();go(u.role==='admin'?'admin':'home');
}
function doReg(){
  var id=(document.getElementById('regId').value||'').trim(),nm=(document.getElementById('regName').value||'').trim(),ps=document.getElementById('regPass').value||'',sc=(document.getElementById('regScore').value||'').trim();
  if(!id||!nm||!ps||!sc)return alert2('אנא מלא את כל השדות!');
  if(users.find(function(u){return u.id===id}))return alert2('מספר אישי כבר רשום!');
  var nl=nm.toLowerCase();if(users.find(function(u){return u.role==='cadet'&&u.name.toLowerCase()===nl&&u.department===sDep}))return alert2('כבר קיים "'+nm+'" במחלקת '+sDep);
  var score=parseInt(sc,10);if(isNaN(score)||score<0)return alert2('ציון לא תקין!');
  var fit='קל';if(score>=91)fit='מקצוען';else if(score>=76)fit='קשה';else if(score>=55)fit='בינוני';
  var nu={id:id,pass:ps,name:nm,department:sDep,scoreHistory:[score],fitness:fit,role:'cadet',medical:'כשיר',workouts:{w1:false,w2:false,w3:false},createdAt:new Date().toISOString()};
  addU(nu);cur=nu;saveCurL();clr();go('home');
}
function doLogout(){tOn=false;if(tInt)clearInterval(tInt);tInt=null;tSec=0;cur=null;saveCurL();clr();go('welcome')}

function tToggle(){tOn=!tOn;var b=document.getElementById('tBtn');if(tOn){b.textContent='עצור';tInt=setInterval(function(){tSec++;document.getElementById('tDisp').textContent=ft(tSec)},1000)}else{b.textContent='הפעל טיימר';if(tInt)clearInterval(tInt);tInt=null}}
function tReset(){tOn=false;if(tInt)clearInterval(tInt);tInt=null;tSec=0;document.getElementById('tDisp').textContent='00:00';document.getElementById('tBtn').textContent='הפעל טיימר'}

function togW(wid){if(!cur)return;if(!cur.workouts)cur.workouts={w1:false,w2:false,w3:false};cur.workouts[wid]=!cur.workouts[wid];saveU(cur);saveCurL();rHome()}
function setMed(s){if(!cur)return;cur.medical=s;saveU(cur);saveCurL();rHome()}

function rHome(){
  if(!cur)return;var w=cur.workouts||{w1:false,w2:false,w3:false};var dn=Object.values(w).filter(function(v){return v===true}).length;
  var plan=PLANS[cur.fitness]||PLANS['קל'];var med=cur.medical||'כשיר';
  document.getElementById('hG').textContent=cur.name;
  document.getElementById('hS').textContent='רמת '+cur.fitness+' • '+cur.department;
  document.getElementById('hDot').style.backgroundColor=mc(med);
  document.getElementById('pLbl').textContent=dn+' מתוך 3 אימונים השבוע';
  document.getElementById('pFill').style.width=Math.round((dn/3)*100)+'%';
  document.getElementById('wList').innerHTML=plan.map(function(it){var d=w[it.id]||false;return '<div class="task-card'+(d?' done':'')+'" onclick="togW(\''+it.id+'\')"><div class="check-circle">'+(d?'✓':'')+'</div><div class="task-info"><div class="task-title">'+it.title+'</div><div class="task-desc">'+it.desc+'</div></div></div>'}).join('');
  document.getElementById('mRow').innerHTML=['כשיר','מוגבל','מושבת'].map(function(s){return '<div class="med-btn'+(med===s?' active':'')+'" onclick="setMed(\''+s+'\')">'+s+'</div>'}).join('');
  document.getElementById('planList').innerHTML=plan.map(function(p){return '<div class="workout-plan"><div class="workout-plan-title">📌 '+p.title+'</div><div class="workout-plan-desc">'+p.desc+'</div></div>'}).join('');
  var tip=getDayTip();document.getElementById('tipTitle').textContent=tip.title;document.getElementById('tipText').textContent=tip.text;
  document.getElementById('nutritionBox').innerHTML='<strong>🍽️ ארוחה יומית</strong>'+getDayNutrition();
}

function rAdmin(){
  document.getElementById('aChips').innerHTML=DEPS.map(function(d){var c=users.filter(function(u){return u.role==='cadet'&&u.department===d}).length;return '<div class="chip'+(aFil===d?' active':'')+'" onclick="aFil=\''+d+'\';rAdmin()">'+d+(c?' <span class="badge">'+c+'</span>':'')+'</div>'}).join('');
  var fl=users.filter(function(u){return u.role==='cadet'&&u.department===aFil});var al=document.getElementById('aList');
  if(!fl.length){al.innerHTML='<div class="empty-msg">אין נתונים למחלקה זו.</div>'}
  else{al.innerHTML=fl.map(function(u){var dn=u.workouts?Object.values(u.workouts).filter(function(v){return v===true}).length:0;var med=u.medical||'כשיר';return '<div class="admin-card"><div class="status-dot-sm" style="background:'+mc(med)+'"></div><div class="admin-info"><div class="admin-name">'+u.name+' <span style="font-size:12px;color:var(--gray);font-weight:400">('+u.id+')</span></div><div class="admin-meta">ביצע: '+dn+'/3 | רמה: '+(u.fitness||'—')+'</div></div><button class="del-btn" onclick="cfDel(\''+u.id+'\',\''+u.name.replace(/'/g,"\\'")+'\')">✕</button></div>'}).join('')}
}
function cfDel(id,nm){confirm2('מחיקת חניך','למחוק את '+nm+'?',function(){delU(id);rAdmin();alert2(nm+' הוסר.')},'מחק')}

function getCd(dep){return users.filter(function(u){return u.role==='cadet'&&(!dep||u.department===dep)})}
function bCSV(cd,t){var csv='\uFEFF דוח כושר - '+t+' - '+sDate()+'\n\nמחלקה,מס,שם,רמה,ציון,א1,א2,א3,סה"כ,רפואי\n';cd.forEach(function(u){var w=u.workouts||{};var d=Object.values(w).filter(function(v){return v===true}).length;var sc=u.scoreHistory&&u.scoreHistory.length?u.scoreHistory[u.scoreHistory.length-1]:'—';csv+=u.department+','+u.id+','+u.name+','+(u.fitness||'—')+','+sc+','+(w.w1?'V':'X')+','+(w.w2?'V':'X')+','+(w.w3?'V':'X')+','+d+'/3,'+(u.medical||'כשיר')+'\n'});return csv}
function dlCSV(csv,fn){var b=new Blob([csv],{type:'text/csv;charset=utf-8'});var u=URL.createObjectURL(b);var a=document.createElement('a');a.href=u;a.download=fn;document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(u)}
function expDep(){var c=getCd(aFil);if(!c.length)return alert2('אין חניכים');dlCSV(bCSV(c,'מחלקת '+aFil),'דוח_'+aFil+'_'+sDate().replace(/\//g,'-')+'.csv');alert2('הדוח יורד')}
function expAll(){var c=getCd();if(!c.length)return alert2('אין חניכים');dlCSV(bCSV(c,'כל'),'דוח_'+sDate().replace(/\//g,'-')+'.csv');alert2('הדוח יורד')}
function bEmailBody(){var cd=getCd();if(!cd.length)return '';var b='דוח כושר\nתאריך: '+hDate()+'\n\n';DEPS.forEach(function(dep){var dc=cd.filter(function(u){return u.department===dep});if(!dc.length)return;b+='סך הכל '+dc.length+' חניכים\n'});return b}
function emailModal(){
  if(!getCd().length)return alert2('אין חניכים');
  document.getElementById('mT').textContent='שלח דוח למייל';document.getElementById('mM').textContent='הזן מייל:';
  document.getElementById('mE').innerHTML='<input class="email-input" id="eIn" type="email" placeholder="example@mail.com" value="'+(adEmail||'')+'">';
  document.getElementById('mB').innerHTML='<button class="btn btn-ghost" onclick="clsM()">ביטול</button><button class="btn btn-blue" onclick="sendEmail()">שלח</button>';
  document.getElementById('modal').classList.add('show');
}
function sendEmail(){
  var em=(document.getElementById('eIn').value||'').trim();if(!em||em.indexOf('@')<0)return alert2('מייל לא תקין');
  adEmail=em;try{localStorage.setItem('admin_email',em)}catch(e){}clsM();
  window.open('mailto:'+encodeURIComponent(em)+'?subject='+encodeURIComponent('דוח כושר'),'_blank');alert2('מייל נפתח');
}
function chkSatBanner(){if(!cur||cur.role!=='admin'||new Date().getDay()!==6)return;var b=document.getElementById('rBanner');if(!b)return;b.innerHTML='<div class="report-banner"><div class="report-banner-title">📋 היום מוצ"ש</div><div class="report-banner-sub">האימונים יתאפסו ב-23:59</div><div class="report-banner-btns"><button class="report-banner-btn report-banner-btn-primary" onclick="expAll()">ייצא</button></div></div>'}
function confirmFullReset(){confirm2('איפוס','כל החניכים יימחקו!',function(){delAllCadets();cur=null;clr();go('welcome');alert2('אופס.')},'מחק')}

initFB();
</script>
