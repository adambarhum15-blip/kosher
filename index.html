<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>כושר מחזור ע"ה</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
/* --- העיצוב המקורי שלך נשמר במלואו --- */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0A0F1C;--card:#151B2D;--card-hover:#1C2540;--dark:#0A0F1C;
  --green:#10B981;--green-glow:rgba(16,185,129,.4);
  --gray:#94A3B8;--gray-dim:#64748B;--gray-bg:#334155;
  --red:#EF4444;--yellow:#F59E0B;--blue:#3B82F6;
  --radius:14px;--shadow:0 8px 32px rgba(0,0,0,.3);
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:#F8FAFC;font-family:'Heebo',sans-serif;-webkit-font-smoothing:antialiased}
.app{max-width:480px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;position:relative;overflow:hidden}
.page{display:none;flex-direction:column;height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:24px 20px 90px;animation:fadeUp .35s ease both}
.page.active{display:flex}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
.welcome-page{justify-content:center;align-items:center;text-align:center;gap:8px}
.logo-ring{width:130px;height:130px;border-radius:50%;background:linear-gradient(135deg,var(--green),#059669);display:flex;align-items:center;justify-content:center;margin-bottom:12px;box-shadow:0 8px 32px rgba(16,185,129,.25);animation:pulse 2.5s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 8px 32px rgba(16,185,129,.25)}50%{box-shadow:0 8px 48px rgba(16,185,129,.4)}}
.logo-ring svg{width:60px;height:60px;fill:#fff}
.main-title{font-size:28px;font-weight:900;color:#fff;margin-bottom:6px}
.sub-label{color:var(--gray);font-size:14px;margin-bottom:24px}
.btn{width:100%;padding:15px;border-radius:var(--radius);font-size:16px;font-weight:700;cursor:pointer;border:none;transition:all .2s;font-family:inherit}
.btn:active{transform:scale(.97)}
.btn-solid{background:var(--green);color:#fff;box-shadow:0 4px 14px rgba(16,185,129,.3);margin-bottom:12px}
.btn-outline{background:transparent;border:2px solid var(--green);color:var(--green)}
.input{width:100%;padding:15px 16px;border-radius:var(--radius);border:1.5px solid var(--gray-light);font-size:16px;font-family:inherit;text-align:right;background:var(--card);transition:border-color .2s;margin-bottom:14px;outline:none;color:#fff}
.field-label{text-align:right;font-weight:700;margin-bottom:8px;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;justify-content:flex-end}
.chip{padding:9px 18px;border-radius:24px;font-size:14px;font-weight:600;cursor:pointer;border:1.5px solid var(--gray-dim);background:var(--card);transition:all .2s;user-select:none;color:var(--gray)}
.chip.active{background:var(--green);color:#fff;border-color:var(--green)}
.card{background:var(--card);padding:20px;border-radius:16px;box-shadow:var(--shadow);margin-bottom:16px}
.progress-bg{height:10px;background:var(--gray-bg);border-radius:6px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--green),#34d399);border-radius:6px;transition:width .5s ease}
.task-card{display:flex;align-items:center;gap:14px;background:var(--card);padding:16px 18px;border-radius:var(--radius);border:1.5px solid var(--gray-bg);margin-bottom:10px;cursor:pointer}
.task-card.done{background:rgba(16,185,129,0.1);border-color:var(--green)}

/* --- עיצוב חדש לשדרוגים --- */
.broadcast-banner {background:linear-gradient(90deg, #F59E0B, #D97706); color:#fff; padding:12px; border-radius:12px; margin-bottom:16px; font-weight:800; font-size:14px; text-align:right; display:none; animation:pulse 2s infinite;}
.countdown-box {text-align:center; margin-bottom:15px; padding:10px; background:rgba(255,255,255,0.03); border-radius:12px;}
.countdown-time {font-size:24px; font-weight:900; color:var(--green);}
.chart-container {width:100%; height:180px; margin-top:10px;}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="page welcome-page active" id="page-welcome">
    <div class="logo-ring"><svg viewBox="0 0 24 24"><path d="M20.57 14.86L22 13.43 20.57 12 17 15.57 8.43 7 12 3.43 10.57 2 9.14 3.43 7.71 2 5.57 4.14 4.14 2.71 2.71 4.14l1.43 1.43L2 7.71l1.43 1.43L2 10.57 3.43 12 7 8.43 15.57 17 12 20.57 13.43 22l1.43-1.43L16.29 22l2.14-2.14 1.43 1.43 1.43-1.43-1.43-1.43L22 16.29z"/></svg></div>
    <div class="main-title">כושר מחזור ע"ה</div>
    <button class="btn btn-solid" onclick="showPage('login')">כניסה</button>
    <button class="btn btn-outline" onclick="showPage('register')">הרשמה</button>
  </div>

  <div class="page" id="page-login">
    <div class="main-title" style="text-align:center">כניסה</div>
    <input class="input" id="loginId" placeholder="מספר אישי" type="text" inputmode="numeric">
    <input class="input" id="loginPass" placeholder="סיסמה" type="password">
    <button class="btn btn-solid" onclick="handleLogin()">היכנס</button>
    <div style="text-align:center; cursor:pointer; color:var(--gray)" onclick="showPage('welcome')">חזור</div>
  </div>

  <div class="page" id="page-register">
    <div class="main-title">הרשמה</div>
    <input class="input" id="regId" placeholder="מספר אישי" type="text" inputmode="numeric">
    <input class="input" id="regName" placeholder="שם מלא">
    <input class="input" id="regPass" placeholder="סיסמה" type="password">
    <input class="input" id="regScore" placeholder="ציון בר-אור" type="text" inputmode="numeric">
    
    <div class="field-label">מין:</div>
    <div class="chips" id="genderChips">
      <div class="chip active" id="chip-male" onclick="setGender('זכר')">זכר</div>
      <div class="chip" id="chip-female" onclick="setGender('נקבה')">נקבה</div>
    </div>

    <div class="field-label">מחלקה:</div>
    <div class="chips" id="regDepsChips"></div>
    <button class="btn btn-solid" onclick="handleRegister()">צור פרופיל</button>
  </div>

  <div class="page" id="page-home">
    <div id="broadcastBanner" class="broadcast-banner">📢 הודעת מפקד</div>
    
    <div class="countdown-box">
      <div style="font-size:12px; color:var(--gray)">זמן לסיום קורס</div>
      <div class="countdown-time" id="courseCountdown">-- ימים -- שעות</div>
    </div>

    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px">
      <div>
        <div class="greeting" id="homeGreeting" style="font-size:22px; font-weight:800"></div>
        <div class="sub-greeting" id="homeSub" style="color:var(--gray)"></div>
      </div>
      <div id="homeStatusDot" style="width:15px; height:15px; border-radius:50%"></div>
    </div>

    <div class="card">
      <div id="progressLabel" style="font-weight:800; margin-bottom:10px"></div>
      <div class="progress-bg"><div class="progress-fill" id="progressFill"></div></div>
    </div>

    <div class="card">
      <div style="display:flex; justify-content:space-between">
        <div style="font-weight:800">📈 התקדמות בר-אור</div>
        <button style="background:var(--blue); color:#fff; border:none; padding:4px 10px; border-radius:8px; font-size:11px" onclick="openScoreUpdate()">עדכן ציון</button>
      </div>
      <div class="chart-container"><canvas id="progressChart"></canvas></div>
    </div>

    <div id="workoutsList"></div>
    
    <div class="field-label">מצב רפואי למסדר:</div>
    <div class="med-row" id="medRow" style="display:flex; gap:10px"></div>
    
    <button class="logout-btn" onclick="logout()" style="background:none; border:none; color:var(--red); width:100%; margin-top:20px; font-weight:800">התנתק</button>
  </div>

  <div class="page" id="page-admin">
    <div class="main-title">חמ"ל מפקדים</div>
    
    <div class="card" style="border:1px solid var(--yellow)">
      <div style="font-weight:800; color:var(--yellow); margin-bottom:10px">📣 כריזה פלוגתית</div>
      <input class="input" id="broadcastInput" placeholder="הקלד הודעה לכולם...">
      <button class="btn btn-solid" style="background:var(--yellow); color:#000" onclick="sendBroadcast()">שלח הודעה</button>
    </div>

    <div class="chips" id="adminDepsChips"></div>
    <div id="adminList"></div>
    <button class="btn btn-blue" style="margin-top:20px" onclick="expAll()">ייצא דוח אקסל</button>
    <button class="logout-btn" onclick="logout()" style="background:none; border:none; color:var(--red); width:100%; margin-top:10px">התנתק</button>
  </div>
</div>

<div class="modal-overlay" id="modal">
  <div class="modal-box">
    <div class="modal-title" id="modalTitle"></div>
    <div class="modal-msg" id="modalMsg"></div>
    <div id="modalExtra"></div>
    <div class="modal-btns" id="modalBtns"></div>
  </div>
</div>

<script>
// --- הגדרות Firebase שלך (נשמרו מהקובץ הקודם) ---
const firebaseConfig = {
  apiKey: "AIzaSyDU7mS3GD8YK3Ee8LXOYF-A0MoCW6Ownus",
  authDomain: "kosher-c538e.firebaseapp.com",
  projectId: "kosher-c538e",
  storageBucket: "kosher-c538e.firebasestorage.app",
  messagingSenderId: "68481676327",
  appId: "1:68481676327:web:14fa2c31d2fa29363a0a02"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// 1. שדרוג: הפעלת מצב אופליין
db.enablePersistence().catch((err) => console.error("Offline error", err));

const DEPARTMENTS=["שגיא","חרמון","גלבוע","רמון","כרמל","תבור","איתן"];
const TRAINING_PLANS={
  "קל":[{id:'w1',title:"כוח א'",desc:"3x10 שכיבות סמיכה, פלאנק."},{id:'w2',title:"אירובי",desc:"20 דק' ריצה קלה."},{id:'w3',title:"רגליים",desc:"3x15 סקוואט."}],
  "בינוני":[{id:'w1',title:"כוח ב'",desc:"15 סמיכה, 8 מתח x4."},{id:'w2',title:"אינטרוולים",desc:"4x400 מטר."},{id:'w3',title:"פק''לים",desc:"100 בטן, 60 סמיכה."}],
  "קשה":[{id:'w1',title:"כוח ג'",desc:"20 יהלום, 12 מתח x5."},{id:'w2',title:"נפח",desc:"5 ק''מ קצב גבוה."},{id:'w3',title:"רגליים",desc:"20 סקוואט קפיצה x5."}],
  "מקצוען":[{id:'w1',title:"עצימות",desc:"עליות כוח, סמיכה יד אחת."},{id:'w2',title:"סימולציה",desc:"ריצת 3 ק''מ 95%."},{id:'w3',title:"CrossFit",desc:"15 מתח, 30 סמיכה, 45 סקוואט."}]
};

let users=[];
let currentUser=null;
let adminFilter=DEPARTMENTS[0];
let selectedDep=DEPARTMENTS[0];
let selectedGender='זכר';
let chartInstance = null;

// 2. שדרוג: טיימר ספירה לאחור לסיום קורס
const TARGET_DATE = new Date("2024-10-30T09:00:00").getTime();
function updateCountdown() {
  const now = new Date().getTime();
  const diff = TARGET_DATE - now;
  if(diff < 0) return;
  const days = Math.floor(diff / (1000 * 60 * 60 * 24));
  const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
  document.getElementById('courseCountdown').innerText = `${days} ימים, ${hours} שעות`;
}

function loadData(){
  // מאזין למשתמשים
  db.collection("users").onSnapshot((snap) => {
    users = [];
    snap.forEach(doc => users.push(doc.data()));
    const cuId = localStorage.getItem('current_user_id');
    if(cuId) {
      currentUser = users.find(u => u.id === cuId);
      if(currentUser) renderHome();
    }
    if(document.getElementById('page-admin').classList.contains('active')) renderAdmin();
  });

  // 3. שדרוג: מאזין למערכת כריזה
  db.collection("config").doc("system").onSnapshot((doc) => {
    const banner = document.getElementById('broadcastBanner');
    if(doc.exists && doc.data().broadcast) {
      banner.innerText = "📢 הודעת מפקד: " + doc.data().broadcast;
      banner.style.display = 'block';
    } else {
      banner.style.display = 'none';
    }
  });

  setInterval(updateCountdown, 1000 * 60);
  updateCountdown();
}

function showPage(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('page-'+id).classList.add('active');
  if(id==='register') renderRegDeps();
}

function setGender(g){
  selectedGender = g;
  document.getElementById('chip-male').classList.toggle('active', g==='זכר');
  document.getElementById('chip-female').classList.toggle('active', g==='נקבה');
}

function renderRegDeps(){
  document.getElementById('regDepsChips').innerHTML = DEPARTMENTS.map(d=>
    `<div class="chip ${selectedDep===d?'active':''}" onclick="selectedDep='${d}';renderRegDeps()">${d}</div>`
  ).join('');
}

async function handleRegister(){
  const id=document.getElementById('regId').value;
  const name=document.getElementById('regName').value;
  const pass=document.getElementById('regPass').value;
  const score=parseInt(document.getElementById('regScore').value);
  if(!id||!name||!pass||isNaN(score)) return alert("מלא הכל");
  
  const fitness = score >= 90 ? 'מקצוען' : score >= 75 ? 'קשה' : score >= 60 ? 'בינוני' : 'קל';
  const newUser = { id, name, pass, department: selectedDep, gender: selectedGender, scoreHistory: [score], fitness, role:'cadet', medical:'כשיר', workouts:{w1:false,w2:false,w3:false} };
  
  await db.collection("users").doc(id).set(newUser);
  localStorage.setItem('current_user_id', id);
  currentUser = newUser;
  showPage('home');
}

function handleLogin(){
  const id=document.getElementById('loginId').value;
  const pass=document.getElementById('loginPass').value;
  const user = users.find(u=>u.id===id && u.pass===pass);
  if(!user) return alert("טעות");
  currentUser = user;
  localStorage.setItem('current_user_id', id);
  showPage(user.role==='admin'?'admin':'home');
}

// 4. שדרוג: גרף התקדמות Chart.js
function renderChart(){
  const ctx = document.getElementById('progressChart').getContext('2d');
  if(chartInstance) chartInstance.destroy();
  chartInstance = new Chart(ctx, {
    type: 'line',
    data: {
      labels: currentUser.scoreHistory.map((_,i)=>'ב'+(i+1)),
      datasets: [{ label: 'בר-אור', data: currentUser.scoreHistory, borderColor: '#10B981', tension: 0.3, fill:true, backgroundColor: 'rgba(16,185,129,0.1)' }]
    },
    options: { plugins: { legend: { display: false } }, scales: { y: { grid: { color: '#334155' }, ticks: { color: '#94A3B8' } } } }
  });
}

function renderHome(){
  if(!currentUser) return;
  const done = Object.values(currentUser.workouts).filter(v=>v===true).length;
  const plan = TRAINING_PLANS[currentUser.fitness] || TRAINING_PLANS['קל'];
  
  document.getElementById('homeGreeting').innerText = "שלום, " + currentUser.name;
  document.getElementById('homeSub').innerText = `${currentUser.department} | ${currentUser.fitness} | ${currentUser.gender}`;
  document.getElementById('progressLabel').innerText = `התקדמות שבועית (${done}/3)`;
  document.getElementById('progressFill').style.width = (done/3)*100 + "%";
  document.getElementById('homeStatusDot').style.background = currentUser.medical==='כשיר'?'#10B981':currentUser.medical==='מוגבל'?'#F59E0B':'#EF4444';
  
  document.getElementById('workoutsList').innerHTML = plan.map((item, i)=>`
    <div class="task-card ${currentUser.workouts['w'+(i+1)]?'done':''}" onclick="toggleWorkout('w'+${i+1})">
      <div class="task-info">
        <div class="task-title">${item.title}</div>
        <div class="task-desc">${item.desc}</div>
      </div>
    </div>`).join('');

  document.getElementById('medRow').innerHTML = ['כשיר','מוגבל','מושבת'].map(m=>
    `<div class="med-btn ${currentUser.medical===m?'active':''}" onclick="updateMed('${m}')">${m}</div>`
  ).join('');

  renderChart();
}

async function toggleWorkout(wid){
  currentUser.workouts[wid] = !currentUser.workouts[wid];
  await db.collection("users").doc(currentUser.id).update({ workouts: currentUser.workouts });
}

async function updateMed(m){
  await db.collection("users").doc(currentUser.id).update({ medical: m });
}

function openScoreUpdate(){
  const s = prompt("הזן ציון בר-אור חדש:");
  if(s) {
    const score = parseInt(s);
    currentUser.scoreHistory.push(score);
    db.collection("users").doc(currentUser.id).update({ scoreHistory: currentUser.scoreHistory });
  }
}

// 5. שדרוג: שידור הודעת מפקד
async function sendBroadcast(){
  const msg = document.getElementById('broadcastInput').value;
  if(!msg) return;
  await db.collection("config").doc("system").set({ broadcast: msg });
  alert("הודעה שודרה!");
  document.getElementById('broadcastInput').value = "";
}

function renderAdmin(){
  document.getElementById('adminDepsChips').innerHTML = DEPARTMENTS.map(d=>
    `<div class="chip ${adminFilter===d?'active':''}" onclick="adminFilter='${d}';renderAdmin()">${d}</div>`
  ).join('');
  const list = users.filter(u=>u.role==='cadet' && u.department===adminFilter);
  document.getElementById('adminList').innerHTML = list.map(u=>`
    <div class="admin-card">
      <div class="admin-info">
        <div style="font-weight:800">${u.name}</div>
        <div style="font-size:12px; color:var(--gray)">${Object.values(u.workouts).filter(v=>v).length}/3 אימונים | ${u.medical}</div>
      </div>
    </div>`).join('');
}

function logout(){ localStorage.clear(); location.reload(); }

window.onload = loadData;
</script>
</body>
</html>
